[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-scaler"
version = "1.0.0"
description = "Scale recipe quantities with exact fraction arithmetic, unit conversion and markdown output. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["recipe", "scaling", "fractions", "units", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]

[project.scripts]
recipe-scaler = "recipe_scaler.cli:main"

[tool.setuptools.packages.find]
include = ["recipe_scaler*"]
